CONFIG_ZMK_KEYBOARD_NAME="Split_Keebz"

CONFIG_ZMK_SPLIT=y

# ---------------------------------------------------------
# Bluetooth Stability & Linux / Intel AX200 Fixes (Issue #1487)
# ---------------------------------------------------------
# Increase Bluetooth transmission power to maximum (+8 dBm)
# Fixes weak signal and intermittent detection with laptop internal antennas
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable ZMK experimental connection settings (forces 1M PHY and stable BLE intervals)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Explicitly disable 2M PHY to prevent Intel AX200 Linux BlueZ dropouts
CONFIG_BT_CTLR_PHY_2M=n

# Passkey entry: Commented out so BlueZ and ZMK negotiate pairing cleanly
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# ---------------------------------------------------------
# Logging (Disabled in production to avoid BLE timing delays & save battery)
# ---------------------------------------------------------
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# Uncomment these two lines to enable encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sleep
# Idle sleep timeout - 5 mins
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Enable deep sleep
CONFIG_ZMK_SLEEP=y
# Deep sleep timeout - 15 mins
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Mouse Controls
CONFIG_ZMK_POINTING=y

# ZMK Studio 
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Enable central (left half) to report both battery levels to host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y          

# Uncomment for Single color backlight
# CONFIG_ZMK_BACKLIGHT=y

# Uncomment for RGB
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment for Display
# CONFIG_ZMK_DISPLAY=y
